apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-loadtest
  namespace: kubedeck-demo
  labels: { app: storefront-loadtest, tier: test }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storefront-loadtest }
  template:
    metadata:
      labels: { app: storefront-loadtest, tier: test }
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              worker() {
                while true; do
                  # bursts of traffic with quiet gaps, so the history has a shape
                  i=0; n=$((RANDOM % 400 + 100))
                  while [ $i -lt $n ]; do wget -q -O /dev/null http://storefront-api.kubedeck-demo.svc/ ; i=$((i+1)); done
                  sleep $((RANDOM % 20 + 5))
                done
              }
              for w in 1 2 3 4 5 6; do worker & done
              wait
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 500m, memory: 64Mi }
