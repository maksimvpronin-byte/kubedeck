apiVersion: v1
kind: Namespace
metadata:
  name: kubedeck-demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubedeck-staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-config
  namespace: kubedeck-demo
data:
  LOG_LEVEL: info
  FEATURE_CHECKOUT_V2: "true"
  CACHE_URL: redis://redis-cache.kubedeck-demo.svc:6379
---
apiVersion: v1
kind: Secret
metadata:
  name: storefront-credentials
  namespace: kubedeck-demo
type: Opaque
stringData:
  DATABASE_URL: postgres://storefront:demo-only-not-real@postgres.kubedeck-demo.svc:5432/storefront
  SESSION_KEY: demo-session-key-not-a-real-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-gateway-tls
  namespace: kubedeck-demo
type: Opaque
immutable: true
stringData:
  MERCHANT_ID: demo-merchant-0042
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront
  namespace: kubedeck-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
  namespace: kubedeck-demo
  labels: { app: storefront-api, tier: frontend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: storefront-api }
  template:
    metadata:
      labels: { app: storefront-api, tier: frontend }
    spec:
      serviceAccountName: storefront
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          envFrom:
            - configMapRef: { name: storefront-config }
            - secretRef: { name: storefront-credentials }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-worker
  namespace: kubedeck-demo
  labels: { app: checkout-worker, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: checkout-worker }
  template:
    metadata:
      labels: { app: checkout-worker, tier: backend }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              n=0
              while true; do
                n=$((n+1))
                ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                printf '%s \033[32mINFO \033[0m checkout.process order=%05d items=%d total=%d.%02d EUR\n' "$ts" "$n" $((n%5+1)) $((n*7%180+12)) $((n*13%100))
                if [ $((n%4)) -eq 0 ]; then printf '%s \033[33mWARN \033[0m payment.retry order=%05d attempt=2 reason="gateway timeout after 2000ms"\n' "$ts" "$n"; fi
                if [ $((n%9)) -eq 0 ]; then printf '%s \033[1;31mERROR\033[0m payment.declined order=%05d code=\033[1m51\033[0m insufficient_funds\n' "$ts" "$n"; fi
                if [ $((n%6)) -eq 0 ]; then printf '%s \033[36mDEBUG\033[0m cache.hit key=cart:%05d ttl=300s\n' "$ts" "$n"; fi
                sleep 2
              done
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: kubedeck-demo
  labels: { app: payment-gateway, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-gateway }
  template:
    metadata:
      labels: { app: payment-gateway, tier: backend }
    spec:
      containers:
        - name: gateway
          image: busybox:1.36
          command: ["sh", "-c", "echo 'starting payment-gateway v3.4.1'; echo 'loading merchant config from /etc/payment/merchant.json'; sleep 3; echo 'FATAL: open /etc/payment/merchant.json: no such file or directory' >&2; exit 1"]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-billing
  namespace: kubedeck-demo
  labels: { app: legacy-billing, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: legacy-billing }
  template:
    metadata:
      labels: { app: legacy-billing, tier: backend }
    spec:
      containers:
        - name: billing
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: "64", memory: 64Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cache
  namespace: kubedeck-demo
  labels: { app: redis-cache, tier: data }
spec:
  serviceName: redis-cache
  replicas: 2
  selector:
    matchLabels: { app: redis-cache }
  template:
    metadata:
      labels: { app: redis-cache, tier: data }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379, name: redis }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-shipper
  namespace: kubedeck-demo
  labels: { app: log-shipper, tier: platform }
spec:
  selector:
    matchLabels: { app: log-shipper }
  template:
    metadata:
      labels: { app: log-shipper, tier: platform }
    spec:
      containers:
        - name: shipper
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date -u +%H:%M:%S) shipped batch size=$((RANDOM%400+50))\"; sleep 5; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: kubedeck-demo
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo report generated"]
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-api
  namespace: kubedeck-demo
  labels: { app: storefront-api }
spec:
  selector: { app: storefront-api }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9113, targetPort: 9113 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: kubedeck-demo
spec:
  clusterIP: None
  selector: { app: redis-cache }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: kubedeck-demo
spec:
  rules:
    - host: shop.kubedeck.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: storefront-api, port: { number: 80 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront-api
  namespace: kubedeck-demo
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: storefront-api }
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront-api
  namespace: kubedeck-demo
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: storefront-api }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-config
  namespace: kubedeck-staging
data:
  LOG_LEVEL: debug
  FEATURE_CHECKOUT_V2: "false"
  CACHE_URL: redis://redis-cache.kubedeck-staging.svc:6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
  namespace: kubedeck-staging
  labels: { app: storefront-api, tier: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storefront-api }
  template:
    metadata:
      labels: { app: storefront-api, tier: frontend }
    spec:
      containers:
        - name: api
          image: nginx:1.27.3-alpine
          ports: [{ containerPort: 80, name: http }]
          envFrom:
            - configMapRef: { name: storefront-config }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
# Created imperatively during the 2.30 screenshots; kept here so Problems shows an Image pull card.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-sync
  namespace: kubedeck-demo
  labels: { app: inventory-sync }
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory-sync }
  template:
    metadata:
      labels: { app: inventory-sync }
    spec:
      containers:
        - name: inventory-sync
          image: registry.invalid/inventory-sync:2.4.1
