appId: dev.kubedeck.app
productName: KubeDeck
artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
afterPack: scripts/electron-after-pack.cjs

directories:
  output: release

files:
  - dist/**/*
  - package.json
  # Window, taskbar and Alt+Tab icons are loaded at runtime, so the icon files
  # must be part of the payload and not only of the installer metadata.
  - assets/icon.ico
  - assets/icon-512.png

asarUnpack:
  - node_modules/node-pty/**/*

win:
  icon: assets/icon.ico
  # Keep rcedit enabled so the packaged KubeDeck.exe carries the KubeDeck icon
  # and version info. Signing stays off: builds run without a certificate and
  # with CSC_IDENTITY_AUTO_DISCOVERY=false.
  signAndEditExecutable: true
  target:
    - target: portable
      arch:
        - x64

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: assets/icon-512.png
  category: Development
  synopsis: Desktop Kubernetes IDE
  desktop:
    entry:
      Keywords: kubernetes;kubectl;cluster;devops;
  target:
    - target: AppImage
      arch:
        - x64

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
