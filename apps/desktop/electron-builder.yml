appId: dev.kubedeck.app
productName: KubeDeck
artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
afterPack: scripts/electron-after-pack.cjs

# Where the update metadata says the update lives. electron-updater reads
# `latest*.yml` from the GitHub release, and electron-builder only writes those
# files when it knows where the release will be - so without this block a
# published release is one nobody is ever offered.
#
# Nothing is published from here. Every packaging script passes `--publish
# never`, and the release is assembled by a single job at the end of
# .github/workflows/release.yml; see the comment there for why electron-builder
# is not allowed to upload for itself.
publish:
  provider: github
  owner: maksimvpronin-byte
  repo: kubedeck

directories:
  output: release

files:
  - dist/**/*
  - package.json
  # Window, taskbar and Alt+Tab icons are loaded at runtime, so the icon files
  # must be part of the payload and not only of the installer metadata.
  - assets/icon.ico
  - assets/icon-512.png

asarUnpack:
  - node_modules/node-pty/**/*

win:
  icon: assets/icon.ico
  # Keep rcedit enabled so the packaged KubeDeck.exe carries the KubeDeck icon
  # and version info. Signing stays off: builds run without a certificate and
  # with CSC_IDENTITY_AUTO_DISCOVERY=false.
  signAndEditExecutable: true
  target:
    # The installer is the only Windows artifact an update can replace in place,
    # so it comes first and `latest.yml` points at it.
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Named without spaces, because the name is also a URL. electron-builder
  # writes the hyphenated form into `latest.yml` - which is what the updater
  # fetches - while GitHub turns spaces in an uploaded file name into dots. The
  # default "KubeDeck Setup 2.23.7.exe" is therefore asked for under a name the
  # release does not hold, and a failed update shows the user nothing at all.
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
    # Not an alternative download: Squirrel.Mac updates from a ZIP and only from
    # a ZIP, so this is the file `latest-mac.yml` points at.
    - target: zip
      arch:
        - arm64

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: assets/icon-512.png
  # electron-builder names the Linux executable after the npm package rather
  # than after productName, and this one is scoped: `@kubedeck/desktop` becomes
  # `@kubedeckdesktop`, which it then refuses as a file name. Nothing caught it
  # because the Linux package had never actually been built - the AppImage the
  # README describes has been a description of an intention.
  executableName: kubedeck
  category: Development
  synopsis: Desktop Kubernetes IDE
  desktop:
    entry:
      Keywords: kubernetes;kubectl;cluster;devops;
  target:
    - target: AppImage
      arch:
        - x64

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
