name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source and contracts
        run: npm run verify

      # Every fix ships as its own release here, so the version lives in six
      # files and each one needs its release notes and regression checklist.
      # Until now nothing but a local run checked that, and a release with a
      # half-updated version would have gone green.
      - name: Verify release contract
        run: npm run verify:release
